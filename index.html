<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milloff Recipes</title>
  <meta name="description" content="Family recipes worth keeping.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="masthead">
    <span class="eyebrow">The Milloff Kitchen</span>
    <h1>Recipes We Keep Making</h1>
    <p>A running collection of the meals worth writing down and passing along.</p>
  </header>

  <main class="grid">

    <!-- ============================================
         ONE CARD PER RECIPE. Copy this whole <div class="card">...</div>
         block to add a new recipe to the homepage.
         ============================================ -->

    <div class="card">
      <a href="recipes/rosemary-parmesan-bread.html">
        <img class="thumb" src="recipes/images/rosemary-parmesan-bread.jpg" alt="Rosemary Parmesan bread">
        <div class="card-body">
          <span class="tag">Baking</span>
          <h2>Rosemary Parmesan Bread</h2>
          <p class="note">Crusty, herby, and better the next day toasted.</p>
        </div>
      </a>
    </div>

    <!-- Example of a second card, ready to fill in and un-comment:

    <div class="card">
      <a href="recipes/your-recipe-file-name.html">
        <img class="thumb" src="recipes/images/your-photo.jpg" alt="Description of the dish">
        <div class="card-body">
          <span class="tag">Category</span>
          <h2>Recipe Name</h2>
          <p class="note">One short line about it.</p>
        </div>
      </a>
    </div>

    -->

  </main>

  <footer>Milloff Recipes &middot; a family collection</footer>

</body>
</html>
